name: Android Build - Ekambani Main APK

on:
  workflow_dispatch:          # the "Run workflow" button in the Actions tab
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: 'apk_and_aab'
        type: choice
        options:
          - apk_and_aab
          - apk_only
          - aab_only
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'apk_and_aab' }}

jobs:
  build:
    name: Build Ekambani-Main.apk / .aab
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME). The old
      # android-actions/setup-android step failed trying to replace the preinstalled
      # command-line tools, so we use the preinstalled SDK and only add what the app needs.
      - name: Set up Android SDK (preinstalled)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "::error::Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SDKM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -r | head -n 1)
          [ -n "$SDKM" ] || SDKM=$(command -v sdkmanager || true)
          [ -n "$SDKM" ] || { echo "::error::sdkmanager not found in $SDK"; exit 1; }
          echo "Using sdkmanager: $SDKM"
          echo "SDKMANAGER=$SDKM" >> "$GITHUB_ENV"
          java -version

      - name: Install required SDK platform and build tools
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36" || { echo "::error::android-36 platform missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/36.0.0" || { echo "::error::build-tools 36.0.0 missing"; exit 1; }
          echo "SDK ready:"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing key from GitHub Secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD:-$SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
          else
            echo "::notice::No KEYSTORE_BASE64 secret set - using the repository key my-upload-key.jks. Keep using the same key so new APKs update the installed app."
            test -f my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=password123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=password123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: env.BUILD_TYPE != 'aab_only'
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Build release AAB
        if: env.BUILD_TYPE != 'apk_only'
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Collect and verify APK
        if: env.BUILD_TYPE != 'aab_only'
        run: |
          set -e
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::Gradle finished but no release APK was produced."; exit 1; fi
          cp "$APK" dist/Ekambani-Main.apk
          SIZE=$(stat -c %s dist/Ekambani-Main.apk)
          if [ "$SIZE" -lt 1000000 ]; then echo "::error::APK is suspiciously small ($SIZE bytes)."; exit 1; fi
          unzip -tq dist/Ekambani-Main.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose dist/Ekambani-Main.apk
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging dist/Ekambani-Main.apk | tee badging.txt | head -n 5
          grep -q "application-label:'Ekambani Main'" badging.txt || { echo "::error::App label is not 'Ekambani Main'."; exit 1; }
          echo "APK OK: $SIZE bytes"

      - name: Collect and verify AAB
        if: env.BUILD_TYPE != 'apk_only'
        run: |
          set -e
          mkdir -p dist
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          if [ -z "$AAB" ]; then echo "::error::Gradle finished but no release AAB was produced."; exit 1; fi
          cp "$AAB" dist/Ekambani-Main.aab
          unzip -tq dist/Ekambani-Main.aab
          echo "AAB OK: $(stat -c %s dist/Ekambani-Main.aab) bytes"

      - name: Upload APK
        if: env.BUILD_TYPE != 'aab_only'
        uses: actions/upload-artifact@v4
        with:
          name: Ekambani-Main-APK
          path: dist/Ekambani-Main.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        if: env.BUILD_TYPE != 'apk_only'
        uses: actions/upload-artifact@v4
        with:
          name: Ekambani-Main-AAB
          path: dist/Ekambani-Main.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ✅ Ekambani Main build succeeded"
            echo "Download **Ekambani-Main-APK** (and **Ekambani-Main-AAB**) from the *Artifacts* section below."
            echo '```'
            (cd dist && sha256sum * )
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Failure summary
        if: failure()
        run: |
          echo "## ❌ Ekambani Main build FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step above to read the Gradle error. Reports are attached as 'build-failure-reports'." >> "$GITHUB_STEP_SUMMARY"
